[package]
name = "mira"
version = "0.3.0"
description = "Claude の使用量制限をタスクトレイに表示する"
edition = "2021"
license = "MIT"
repository = "https://github.com/nanase/mira"
publish = false

[lib]
name = "mira_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "native-tls", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sys-locale = "0.3.2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tiny-skia = "0.12.0"
tokio = { version = "1.53.1", features = ["time", "sync", "macros", "fs"] }
ttf-parser = "0.25.1"
uuid = { version = "1.26.1", features = ["v4"] }
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
resvg = "0.45"
