<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Mira</title>
<style>
:root {
  color-scheme: dark;
}

html,
body {
  margin: 0;
  width: 1280px;
  height: 640px;
  overflow: hidden;
  background: #0e1124;
  color: #f3f3f3;
  font-family: "Segoe UI Variable Display", "Segoe UI", "Yu Gothic UI", "Meiryo UI", sans-serif;
}

.stage {
  position: relative;
  width: 1280px;
  height: 640px;
  overflow: hidden;
}

.copy {
  position: absolute;
  left: 72px;
  top: 72px;
  width: 520px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 22px;
}

.brand img {
  width: 96px;
  height: 96px;
}

h1 {
  margin: 0;
  font-size: 80px;
  font-weight: 700;
  line-height: 1;
}

.tagline {
  margin: 32px 0 0;
  font-size: 28px;
  font-weight: 600;
  line-height: 1.45;
}

ul {
  margin: 26px 0 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

li {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 19px;
  color: #c9cbd6;
}

li::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 4px;
  background: #e5334a;
  flex-shrink: 0;
}

.meta {
  position: absolute;
  left: 72px;
  bottom: 72.5px;
  font-size: 15px;
  color: #8b8fa6;
}

.window {
  position: absolute;
  border: 0;
  background: transparent;
}

/* トレイアイコン。アプリが描く形（リング、時間マーカー、頭文字）と同じ */
.tray {
  position: absolute;
  /* 手前のライトのポップアップ（左 878px、幅 340px）の中心にそろえる */
  left: 1048px;
  top: 507px;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  border-radius: 12px;
  background: #eeeeee;
  border: 1px solid rgba(0, 0, 0, 0.08);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
}

.tray svg {
  width: 32px;
  height: 32px;
}

.tray .active {
  padding: 4px;
  margin: -4px;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.08);
}

.popover-frame {
  width: 340px;
  height: 580px;
  filter: drop-shadow(0 24px 40px rgba(0, 0, 0, 0.55));
}

/* 右の手前にライト、左の奥にダークを少し重ねて置く */
.popover-frame.light {
  /* 中のページと同じ配色にしないと、ブラウザが iframe に不透明な背景を描く */
  color-scheme: light;
  z-index: 2;
  left: 878px;
  top: 93px;
}

.popover-frame.dark {
  left: 570px;
  top: 73px;
}
</style>
</head>
<body>
<div class="stage">
  <div class="copy">
    <div class="brand">
      <img src="../../../src-tauri/icons/icon.svg" alt="">
      <h1>Mira</h1>
    </div>
    <p class="tagline">Claude の使用量を<br>タスクトレイでシンプルに表示</p>
    <ul>
      <li>5 時間・週間制限・追加使用量</li>
      <li>時間マーカーで使うペースがひと目でわかる</li>
      <li>複数アカウントに対応</li>
      <li>ライトテーマ・ダークテーマに対応</li>
    </ul>
  </div>
  <div class="meta">Windows 10 / 11 · Rust + Tauri · MIT License</div>
  <iframe class="window popover-frame light" src="build/popover.html?theme=light&amp;profile=personal" title="ポップアップ（ライト）"></iframe>
  <div class="tray" aria-label="トレイアイコン">
    <span><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="rgba(0,0,0,0.16)" stroke-width="5"/><circle cx="16" cy="16" r="12" fill="none" stroke="#b25000" stroke-width="5" stroke-dasharray="55.79 75.40" transform="rotate(-90 16 16)"/><line x1="10.87" y1="10.53" x2="5.39" y2="4.70" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round"/><text x="16" y="16.5" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" font-family="Segoe UI, sans-serif" fill="#1a1a1a">W</text></svg></span>
    <span class="active"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="rgba(0,0,0,0.16)" stroke-width="5"/><circle cx="16" cy="16" r="12" fill="none" stroke="#1b7a3a" stroke-width="5" stroke-dasharray="29.41 75.40" transform="rotate(-90 16 16)"/><line x1="12.94" y1="22.85" x2="9.67" y2="30.15" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round"/><text x="16" y="16.5" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" font-family="Segoe UI, sans-serif" fill="#1a1a1a">P</text></svg></span>
  </div>
  <iframe class="window popover-frame dark" src="build/popover.html?profile=work" title="ポップアップ（ダーク）"></iframe>
</div>
</body>
</html>
