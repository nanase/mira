<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Mira</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="consent.css">
<script type="module" src="consent.js"></script>
</head>
<body>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="title">
  <div class="body" data-tauri-drag-region>
    <div class="step" id="step" data-tauri-drag-region></div>
    <h1 id="title" data-tauri-drag-region></h1>
    <p class="lead" id="lead" data-tauri-drag-region></p>
    <div class="facts" id="facts"></div>
    <label class="name hidden" id="name-label"><span id="name-caption"></span><input type="text" id="name" maxlength="40" autocomplete="off" spellcheck="false"></label>
    <p class="note hidden" id="note"></p>
  </div>
  <div class="actions">
    <button type="button" class="button primary" id="yes"></button>
    <button type="button" class="button" id="no"></button>
  </div>
</div>
</body>
</html>
